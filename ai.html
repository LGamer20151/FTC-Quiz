<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>FTC Game Manual AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-card {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      max-width: 800px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(92, 200, 255, 0.15);
      border-radius: 18px;
      overflow: hidden;
    }
    
    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .msg.user {
      background-color: #ff9f43;
      color: #07111f;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.ai {
      background: rgba(255, 255, 255, 0.08);
      color: #e8f4ff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid rgba(232, 244, 255, 0.1);
    }

    .chat-input-wrapper {
      display: flex;
      padding: 15px;
      background: rgba(7, 17, 31, 0.95);
      border-top: 1px solid rgba(92, 200, 255, 0.15);
      gap: 10px;
    }

    .chat-input-wrapper input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 244, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
    }

    .chat-input-wrapper input:focus {
      outline: none;
      border-color: #5cc8ff;
    }

    .chat-input-wrapper button {
      background: #5cc8ff;
      color: #07111f;
      border: none;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .chat-input-wrapper button:hover {
      background: #3cb8f5;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">← Back to Dashboard</a>
    <span class="season">BIOBUZZ™ Master Database Engine</span>
  </header>
  
  <main>
    <section class="chat-card">
      <div class="chat-window" id="chatWindow">
        <div class="msg ai">
          <strong>🤖 Master BIOBUZZ Database AI:</strong><br>
          I now contain the complete operating knowledge of the 2026-2027 season! Say hi or ask me about sizing, motors, game pieces, flowers, hives, or checkpoints.
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="queryInput" placeholder="Ask any question (e.g., 'hi', 'how many motors are allowed')..." onkeypress="if(event.key === 'Enter') handleQuery()">
        <button onclick="handleQuery()">Ask</button>
      </div>
    </section>
  </main>

  <script>
    const automatedAnswers = [
      {
        keywords: ["hi", "hello", "hey", "yo", "greetings"],
        response: "🤖 <strong>Hello there!</strong> Welcome to your team's FTC BIOBUZZ knowledge engine. Ask me anything about the rules, motors, balls, sizing constraints, or timing rules, and I will pull up the exact specifications instantly!"
      },
      {
        keywords: ["ball", "balls", "preload", "start with", "starting element", "game piece", "pieces"],
        response: "<strong>BIOBUZZ Match Setup Criteria (Section 9.8):</strong><br>• Each robot can preload with a maximum of <strong>1 Scoring Element (pollen ball)</strong>.<br>• Initial field inventory elements consist of exactly <strong>40 neutral Pollen spheres</strong> (2.8 inches across) and <strong>16 alliance-colored Nectar spheres</strong> (3.6 inches across, heavier than pollen).<br>• Robots are permitted to hold/control a maximum configuration of up to <strong>4 game pieces simultaneously</strong> in any combination!"
      },
      {
        keywords: ["motor", "servo", "electronics", "limit", "actuator", "i302"],
        response: "<strong>Rule I302 & Robot Limits:</strong> Teams are strictly limited to a maximum allowance of <strong>8 motors</strong> and <strong>8 servos</strong> total this season! This total applies to all electronics used to build your base drivetrain chassis plus all auxiliary mechanism attachments combined, whether they are running mounted on the robot at the same time or not."
      },
      {
        keywords: ["size", "sizing", "cube", "expand", "dimension", "inches"],
        response: "<strong>Robot Sizing Constraints:</strong> At the immediate start of a match, the robot must fit completely inside a standard <strong>18-inch sizing cube</strong>. After the match begins and the initialization scripts run, the robot can dynamically expand up to maximum operational bounds of <strong>18 x 24 x 29 inches</strong>."
      },
      {
        keywords: ["hive", "hives", "tip", "tipping", "seesaw"],
        response: "<strong>Hive Scoring Mechanics:</strong> Robots score by launching pollen or alliance nectar into their respective alliance-specific Hive containers, which sit balanced on a central seesaw array. Tipping a hive cell container down to cross specific balance thresholds awards points. Because Nectar balls are significantly heavier, fewer Nectar pieces are needed to tip the hive compared to Pollen."
      },
      {
        keywords: ["flower", "flowers", "endgame", "topmost", "bottommost"],
        response: "<strong>Flower Scoring Mechanics (Last 60 Seconds):</strong> Neutral field flowers become active scoring targets during the final 60 seconds of the teleoperated match. Robots drop elements in from the top. Scoring is assessed at the end of the match based on layering: the alliance holding the <strong>bottommost nectar</strong> in a flower scores fixed points, while the alliance holding the <strong>topmost nectar</strong> earns scoring points for every single pollen and nectar element contained inside that entire flower!"
      },
      {
        keywords: ["score", "points", "ranking", "rp", "win"],
        response: "<strong>Match Points & Rankings (Section 4.1):</strong><br>• <strong>Winning a Match:</strong> 3 Ranking Points (RP).<br>• <strong>Playoff Finish:</strong> Winners receive 40 advancement points; Finalists receive 20 points.<br>• <strong>Inspire Award:</strong> 1st = 60pts, 2nd = 30pts, 3rd = 15pts.<br>• <strong>Other Judged Awards:</strong> 1st = 12pts, 2nd = 6pts, 3rd = 3pts."
      },
      {
        keywords: ["e101", "safety glasses", "shoes", "hair", "eye protection"],
        response: "<strong>Rule E101 (Personal Safety):</strong> All team members must wear safety glasses in specified areas (with a 10-minute morning grace window). Closed-toed/heeled shoes are strictly mandatory. Long hair and dangling items (like lanyards) must be tied back while working on the robot."
      },
      {
        keywords: ["i102", "check in", "pit admin", "late", "deadline"],
        response: "<strong>Rule I102 (Event Check-In):</strong> An adult team member must check-in at the Pit Administration station no later than <strong>45 minutes before</strong> Qualification Matches are scheduled to start. At least one student teammate must be physically present at the venue before check-in can be finalized."
      },
      {
        keywords: ["i303", "reinspection", "change", "re-inspect", "modify"],
        response: "<strong>Rule I303 (Re-inspection Rules):</strong> Most changes require re-inspection. However, it is <strong>NOT necessary</strong> for replacing identical components, modifying code, switching identical mechanisms, or editing fasteners (tape, zip ties, rivets)."
      },
      {
        keywords: ["e301", "wi-fi", "wifi", "bluetooth", "hotspot", "network"],
        response: "<strong>Rule E301 (Wireless Rule):</strong> Teams may not set up their own Wi-Fi access points, ad-hoc networks, mobile hotspots, or custom wireless communications networks using 2.4GHz or 5GHz bands in the venue. Standard Bluetooth devices can also cause interference and are banned near the fields."
      },
      {
        keywords: ["e504", "grinder", "flame", "welding", "torch", "spark"],
        response: "<strong>Rule E504 (Open Flames & Tools):</strong> Tools that throw sparks or produce open flames are prohibited. Prohibited tools include welders, angle grinders, bench grinders, and gas torches. Lighters used briefly to melt frayed rope edges are generally acceptable."
      },
      {
        keywords: ["e505", "3d printer", "machinery", "pit tool", "drill press"],
        response: "<strong>Rule E505 (Pit Machinery):</strong> Only small benchtop machinery that can be easily lifted by one single person is permitted inside your pit space (e.g., 3D printers, small band saws, desktop CNC mills). Floor-standing power tools are completely banned."
      }
    ];

    function handleQuery() {
      const inputEl = document.getElementById('queryInput');
      const text = inputEl.value.trim().toLowerCase();
      if (!text) return;

      appendMessage(inputEl.value.trim(), 'user');
      inputEl.value = '';

      let foundResponse = "";

      for (let item of automatedAnswers) {
        let match = item.keywords.some(word => text.includes(word));
        if (match) {
          foundResponse = item.response;
          break;
        }
      }

      if (!foundResponse) {
        foundResponse = "I couldn't find a direct record for that phrase in my seasonal rule database tree. Try querying terms like <strong>'hi'</strong>, <strong>'size'</strong>, <strong>'motors'</strong>, <strong>'hive'</strong>, <strong>'flowers'</strong>, <strong>'balls'</strong>, or <strong>'safety glasses'</strong>!";
      }

      setTimeout(() => {
        appendMessage(foundResponse, 'ai');
      }, 300);
    }

    function appendMessage(msgText, sender) {
      const windowEl = document.getElementById('chatWindow');
