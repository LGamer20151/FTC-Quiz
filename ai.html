<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>FTC Game Manual AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-card {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      max-width: 800px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(92, 200, 255, 0.15);
      border-radius: 18px;
      overflow: hidden;
    }
    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      background-color: #ff9f43;
      color: #07111f;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.ai {
      background: rgba(255, 255, 255, 0.08);
      color: #e8f4ff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid rgba(232, 244, 255, 0.1);
    }
    .chat-input-wrapper {
      display: flex;
      padding: 15px;
      background: rgba(7, 17, 31, 0.95);
      border-top: 1px solid rgba(92, 200, 255, 0.15);
      gap: 10px;
    }
    .chat-input-wrapper input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 244, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
    }
    .chat-input-wrapper button {
      background: #5cc8ff;
      color: #07111f;
      border: none;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">← Back to Dashboard</a>
    <span class="season">BIOBUZZ™ Live AI Reference</span>
  </header>
  
  <main>
    <section class="chat-card">
      <div class="chat-window" id="chatWindow">
        <div class="msg ai">
          <strong>🤖 BIOBUZZ Robot AI:</strong><br>
          Hello! Ask me any question about the 2026-2027 Game Manual rules, constraints, or timelines.
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="queryInput" placeholder="Ask a manual question..." onkeypress="if(event.key === 'Enter') handleQuery()">
        <button onclick="handleQuery()">Send</button>
      </div>
    </section>
  </main>

  <script>
    // CRITICAL: Replace this with your backend url once deployed to Render or Vercel
    const BACKEND_URL = "https://onrender.com";

    async function handleQuery() {
      const inputEl = document.getElementById('queryInput');
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputEl.value = '';
      const loadNode = appendMessage('Analyzing manual database...', 'ai');

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        
        const data = await res.json();
        let formattedAnswer = data.answer.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        loadNode.innerHTML = `<strong>🤖 BIOBUZZ Robot AI:</strong><br>${formattedAnswer}`;
      } catch (err) {
        loadNode.innerText = "Could not reach the web server. Make sure your cloud backend is active.";
        console.error(err);
      }
    }

    function appendMessage(msgText, sender) {
      const windowEl = document.getElementById('chatWindow');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = msgText;
      windowEl.appendChild(div);
      windowEl.scrollTop = windowEl.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
