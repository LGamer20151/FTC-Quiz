<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>FTC Game Manual AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-card {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      max-width: 800px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(92, 200, 255, 0.15);
      border-radius: 18px;
      overflow: hidden;
    }
    
    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .msg.user {
      background-color: #ff9f43;
      color: #07111f;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.ai {
      background: rgba(255, 255, 255, 0.08);
      color: #e8f4ff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid rgba(232, 244, 255, 0.1);
    }

    .chat-input-wrapper {
      display: flex;
      padding: 15px;
      background: rgba(7, 17, 31, 0.95);
      border-top: 1px solid rgba(92, 200, 255, 0.15);
      gap: 10px;
    }

    .chat-input-wrapper input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 244, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
    }

    .chat-input-wrapper input:focus {
      outline: none;
      border-color: #5cc8ff;
    }

    .chat-input-wrapper button {
      background: #5cc8ff;
      color: #07111f;
      border: none;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .chat-input-wrapper button:hover {
      background: #3cb8f5;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">← Back to Dashboard</a>
    <span class="season">BIOBUZZ™ Instant Lookup Engine</span>
  </header>
  
  <main>
    <section class="chat-card">
      <div class="chat-window" id="chatWindow">
        <div class="msg ai">
          <strong>🤖 BIOBUZZ Rule Matcher:</strong><br>
          Hello! Ask me any question about the 2026-2027 Competition rules, safety guidelines, checking in, preloads, or pit constraints. I will instantly find your answer!
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="queryInput" placeholder="Type your rule question here (e.g., 'how many balls does the robot start with')..." onkeypress="if(event.key === 'Enter') handleQuery()">
        <button onclick="handleQuery()">Ask</button>
      </div>
    </section>
  </main>

  <script>
    const automatedAnswers = [
      {
        keywords: ["ball", "balls", "preload", "start with", "starting element"],
        response: "<strong>BIOBUZZ Match Setup Criteria (Section 9.8):</strong> During the formal pre-match layout configuration, each robot can be preloaded with a maximum of <strong>1 Scoring Element (pollen ball element)</strong>. The remaining game elements start stored directly inside the arena's tracking zones, storage structures, and HIVE layouts."
      },
      {
        keywords: ["e101", "safety glasses", "shoes", "hair", "eye protection"],
        response: "<strong>Rule E101 (Personal Safety):</strong> All team members must wear safety glasses in specified areas (with a 10-minute morning grace window). Closed-toed/heeled shoes are strictly mandatory. Long hair and dangling items (like lanyards) must be tied back while working on the robot."
      },
      {
        keywords: ["i102", "check in", "pit admin", "late", "deadline"],
        response: "<strong>Rule I102 (Event Check-In):</strong> An adult team member must check-in at the Pit Administration station no later than <strong>45 minutes before</strong> Qualification Matches are scheduled to start. At least one student teammate must be physically present at the venue before check-in can be finalized."
      },
      {
        keywords: ["i302", "electronics", "motor", "limit", "servo"],
        response: "<strong>Rule I302 (Configuration Limits):</strong> The total number of electronics (motors, servos, control units) used to build all mechanisms and the base robot may not exceed constraints, regardless of whether they are mounted on the robot at the same time or not."
      },
      {
        keywords: ["i303", "reinspection", "change", "re-inspect", "modify"],
        response: "<strong>Rule I303 (Re-inspection Rules):</strong> Most changes require re-inspection. However, it is <strong>NOT necessary</strong> for replacing identical components, modifying code, switching identical mechanisms, or editing fasteners (tape, zip ties, rivets)."
      },
      {
        keywords: ["e301", "wi-fi", "wifi", "bluetooth", "hotspot", "network"],
        response: "<strong>Rule E301 (Wireless Rule):</strong> Teams may not set up their own Wi-Fi access points, ad-hoc networks, mobile hotspots, or custom wireless communications networks using 2.4GHz or 5GHz bands in the venue. Standard Bluetooth devices can also cause interference and are banned near the fields."
      },
      {
        keywords: ["e504", "grinder", "flame", "welding", "torch", "spark"],
        response: "<strong>Rule E504 (Open Flames & Tools):</strong> Tools that throw sparks or produce open flames are prohibited. Prohibited tools include welders, angle grinders, bench grinders, and gas torches. Lighters used briefly to melt frayed rope edges are generally acceptable."
      },
      {
        keywords: ["e505", "3d printer", "machinery", "pit tool", "drill press"],
        response: "<strong>Rule E505 (Pit Machinery):</strong> Only small benchtop machinery that can be easily lifted by one single person is permitted inside your pit space (e.g., 3D printers, small band saws, desktop CNC mills). Floor-standing power tools are completely banned."
      },
      {
        keywords: ["point", "score", "inspire", "award", "rank"],
        response: "<strong>Section 4.1 (Advancement Points):</strong><br>• Inspire Award 1st Place = 60 Points<br>• Inspire Award 2nd Place = 30 Points<br>• Inspire Award 3rd Place = 15 Points<br>• Other Judged Awards (1st Place) = 12 Points<br>• Playoff Tournament Winners = 40 Points"
      }
    ];

    function handleQuery() {
      const inputEl = document.getElementById('queryInput');
      const text = inputEl.value.trim().toLowerCase();
      if (!text) return;

      appendMessage(inputEl.value.trim(), 'user');
      inputEl.value = '';

      let foundResponse = "";

      for (let item of automatedAnswers) {
        let match = item.keywords.some(word => text.includes(word));
        if (match) {
          foundResponse = item.response;
          break;
        }
      }

      if (!foundResponse) {
        foundResponse = "I couldn't find an exact match for that question. Try asking specifically about phrases like: <strong>'how many balls does the robot start with'</strong>, <strong>'safety glasses'</strong>, <strong>'check in'</strong>, <strong>'wi-fi'</strong>, <strong>'3d printer'</strong>, or specific rule numbers like <strong>'E101'</strong> or <strong>'I102'</strong>!";
      }

      setTimeout(() => {
        appendMessage(foundResponse, 'ai');
      }, 300);
    }

    function appendMessage(msgText, sender) {
      const windowEl = document.getElementById('chatWindow');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = msgText;
      windowEl.appendChild(div);
      windowEl.scrollTop = windowEl.scrollHeight;
    }
  </script>
</body>
</html>
