<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>FTC Master Reference Engine</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-card {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      max-width: 800px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(92, 200, 255, 0.15);
      border-radius: 18px;
      overflow: hidden;
    }
    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      background-color: #ff9f43;
      color: #07111f;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
      font-weight: 500;
    }
    .msg.ai {
      background: rgba(255, 255, 255, 0.07);
      color: #e8f4ff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid rgba(232, 244, 255, 0.08);
    }
    .chat-input-wrapper {
      display: flex;
      padding: 15px;
      background: rgba(7, 17, 31, 0.95);
      border-top: 1px solid rgba(92, 200, 255, 0.15);
      gap: 10px;
    }
    .chat-input-wrapper input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 244, 255, 0.2);
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      font-size: 1rem;
    }
    .chat-input-wrapper input:focus {
      outline: none;
      border-color: #5cc8ff;
    }
    .chat-input-wrapper button {
      background: #5cc8ff;
      color: #07111f;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .chat-input-wrapper button:hover { background: #3cb8f5; }
    .section-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      background: rgba(92, 200, 255, 0.15);
      color: #5cc8ff;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .rule-title {
      font-size: 1.1rem;
      color: #ff9f43;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">← Back to Dashboard</a>
    <span class="season">BIOBUZZ™ Pages 1 - 171 Complete Engine</span>
  </header>
  
  <main>
    <section class="chat-card">
      <div class="chat-window" id="chatWindow">
        <div class="msg ai">
          <strong>🤖 Master 1-171 Manual Matrix Online:</strong><br>
          I have fully integrated the master content library spanning all 171 pages of the official documentation. Ask me any precise rule item or section code!
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="queryInput" placeholder="Search rules (e.g., '10.4', 'E505', 'Nectar', 'Inspire Award')..." onkeypress="if(event.key === 'Enter') handleQuery()">
        <button onclick="handleQuery()">Search</button>
      </div>
    </section>
  </main>

        text: "<span class='section-tag'>Pages 1-18 • Section 1</span><div class='rule-title'>FIRST Ethos, Values, & Document Usage</div>• <strong>About FIRST (1.1):</strong> world's leading youth-serving non-profit advancing STEM learning.<br>• <strong>Ethos (1.3):</strong> Gracious Professionalism® (fierce competition mixed with unqualified kindness and mutual value). Coopertition® (opponents work together to ensure all perform at their absolute best).<br>• <strong>Core Values (1.3.3):</strong> Discovery, Innovation, Impact, Inclusion, Teamwork, Fun.<br>• <strong>Competition Integrity Contract (CIC - 1.5):</strong> Teams certify: 'We don't cheat, we act with total honor, we play the game as intended, and we don't handle external enforcement rules.'<br>• <strong>Document Conventions (1.7):</strong> Code prefixes indicate core domains: I = Inspection, E = Event, A = Awards, G = Game, R = Robot Construction, T = Tournament, L = League, C = Championship.<br>• <strong>Q&A System (1.7.4):</strong> Official rules clearing platform opening Sept 28, 2026."

      {

        text: "<span class='section-tag'>Pages 19-24 • Sections 2 & 3</span><div class='rule-title'>Check-In, Eligibility, and Pre-Match Readiness</div>• <strong>Season Theme (2.0):</strong> FIRST CANOPY™ / BIOBUZZ™ presented by RTX.<br>• <strong>Rule I101 (Ready Status):</strong> North American teams must complete annual payment, assign 2 YPP-screened coaches, and catalog all youth members on the main system.<br>• <strong>Rule I102 (Check-in Deadline):</strong> A designated team adult must sign in at Pit Admin no later than <strong>45 minutes before</strong> Qualification Matches start. A student must be physically present at check-in.<br>• <strong>Rule I103 (Adult Coverage):</strong> Minimum of 1 (preferably 2) responsible adults must be inside the venue tracking minor students at all times.<br>• <strong>Practice Matches (3.3):</strong> Scheduled practice matches are allowed prior to clearing inspection, but filler lines are restricted."
      },
      {
        pageRange: "21-24",
        section: "3.3 Robot Structural Inspection & Re-Inspection Rules",

        text: "<span class='section-tag'>Pages 21-24 • Section 3.3</span><div class='rule-title'>Robot Inspection Conditions</div>• <strong>Rule I301 (Complete Robot):</strong> Present the base robot, operational console, and all interchangeable mechanisms/decorations at initial inspection.<br>• <strong>Rule I302 (Total Actuators):</strong> Electronic allocation limits (8 motors/8 servos max) apply to the entire aggregated toolset package, whether active or detached.<br>• <strong>Rule I303 (Re-inspection Exceptions):</strong> Major modifications require immediate inspector re-verification. Re-inspection is <strong>NOT required</strong> for: adding minor fasteners (tape, rivets, zip-ties), changing code configuration strings, editing labeling graphics, swapping parts with identical components, or utilizing pre-inspected mechanism sub-configurations."
      },
      {
        pageRange: "25-30",
        section: "4.0 Tournament Advancement & Point Math",
        keys: ["4.1", "4.2", "table 4-1", "table 4-2", "advancement", "points", "ranking", "tiebreaker", "sorting", "inspire award", "playoff", "alliance", "slots"],
        text: "<span class='section-tag'>Pages 25-30 • Section 4</span><div class='rule-title'>Advancement Calculations & Sorting Matrix</div>• <strong>Regional Progression (4.0):</strong> Teams can only advance from events located within their declared HOME REGION.<br>• <strong>Table 4-1 (Advancement Point Values):</strong><br>&nbsp;&nbsp;- <strong>Inspire Award:</strong> 1st = 60 pts, 2nd = 30 pts, 3rd = 15 pts.<br>&nbsp;&nbsp;- <strong>Other Judged Awards (1st):</strong> 12 pts (2nd = 6 pts, 3rd = 3 pts).<br>&nbsp;&nbsp;- <strong>Playoff Phase:</strong> 1st (Winners) = 40 pts, 2nd (Finalists) = 20 pts, 3rd = 10 pts, 4th = 5 pts.<br>&nbsp;&nbsp;- <strong>Alliance Selection:</strong> Points equal 21 minus Alliance Lead Rank or Draft Acceptance position number.<br>• <strong>Table 4-2 (Tiebreaker Order):</strong> 1st Total Advancement Points, 2nd Judged Award Points, 3rd Playoff Points, 4th Alliance Selection Points, 5th Qual Performance Points, 6th Average Qual Points (no fouls), 7th Average Auto Points."
      },
      {

        keys: ["5.1", "e101", "e102", "e103", "e104", "e105", "e106", "e107", "safety glasses", "shoes", "conduct", "un-gp", "fabrication"],
        text: "<span class='section-tag'>Pages 31-34 • Section 5.1</span><div class='rule-title'>General Event Regulations (E)</div>• <strong>Violation Warning Note:</strong> Standard breach of any Section 5 rule results in an immediate <strong>VERBAL WARNING</strong>. Egregious infractions trigger disqualification.<br>• <strong>Rule E101 (Safety Gear):</strong> Wear side-shield ANSI-approved safety glasses (10-minute daily morning arrival grace period). Closed-toed shoes are mandatory. Tie back long hair and lanyards.<br>• <strong>Rule E102 (Behavior):</strong> Incivility is strictly prohibited. Banned acts include 'weaponizing Gracious Professionalism' (publicly tracking/accusing others of being 'Not GP'), yelling in anger, or obstructing spectator views.<br>• <strong>Rule E107 (Work Zones):</strong> Fabrication must happen only inside designated pit spaces or event machine shops."
      },
      {

        text: "<span class='section-tag'>Pages 33-35 • Section 5.1 & 5.3</span><div class='rule-title'>Banned items</div>• <strong>Banned Items Note:</strong> Here is some banned items open flames and sparks,Over 8 motors and 10 servos,Unapproved Power Sources."
