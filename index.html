<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>FTC Quiz | Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="FTC Quiz home">FTC Quiz</a>
        <span class="season-label">2026–2027 Season</span>
      </header>

      <main class="app">
        <section id="homeScreen" class="screen active" aria-labelledby="pageTitle">
          <div class="hero-card">
            <p class="eyebrow">FIRST Tech Challenge</p>
            <h1 id="pageTitle">Choose your role</h1>
            <p class="subtitle">
              Pick a quiz path to get started. Your team can practice as a builder or a driver.
            </p>

            <div class="role-grid">
              <button class="role-card" type="button" data-role="builder">
                <span class="role-icon" aria-hidden="true">🛠️</span>
                <span class="role-name">Builder</span>
                <span class="role-description">Practice recognizing robot parts</span>
                <span class="role-cta">Coming soon</span>
              </button>

              <button class="role-card" type="button" data-role="driver">
                <span class="role-icon" aria-hidden="true">🏁</span>
                <span class="role-name">Driver</span>
                <span class="role-description">Practice game rules and match knowledge</span>
                <span class="role-cta">Coming soon</span>
              </button>
            </div>

            <p class="home-note">
              The home page is ready. Quiz questions will be added in a later step.
            </p>
          </div>
        </section>

        <section id="selectionScreen" class="screen" aria-live="polite" aria-labelledby="selectionTitle">
          <div class="hero-card selection-card">
            <p class="eyebrow">FTC Quiz</p>
            <h1 id="selectionTitle">Quiz coming soon</h1>
            <p id="selectionMessage" class="subtitle"></p>
            <button id="backHomeButton" class="primary-btn" type="button">Back to home</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
