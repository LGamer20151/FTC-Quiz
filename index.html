<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTC Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">FTC Quiz</div>
      </header>

      <main class="app">
        <section id="homeScreen" class="screen active">
          <div class="hero-card">
            <p class="eyebrow">FIRST Tech Challenge</p>
            <h1>Pick your team role</h1>
            <p class="subtitle">
              Test your FTC knowledge as a builder or driver for the 2026–2027 season.
            </p>

            <div class="role-grid">
              <button class="role-card" data-role="builder">
                <span class="role-icon">🛠️</span>
                <span class="role-name">Builder</span>
                <small>Identify robot parts</small>
              </button>

              <button class="role-card" data-role="driver">
                <span class="role-icon">🏁</span>
                <span class="role-name">Driver</span>
                <small>Know the rules and gameplay</small>
              </button>
            </div>
          </div>
        </section>

        <section id="quizScreen" class="screen">
          <div class="quiz-header">
            <div id="progressText" class="progress-text">Question 1 / 1</div>
            <button id="homeBtn" class="secondary-btn">Home</button>
          </div>

          <div class="quiz-card">
            <div id="categoryBadge" class="category-badge">Builder</div>
            <h2 id="questionText">Question text</h2>

            <div id="imageContainer" class="image-container hidden"></div>

            <div id="choices" class="choices"></div>
          </div>

          <div class="quiz-footer">
            <button id="prevBtn" class="secondary-btn">Previous</button>
            <button id="nextBtn" class="primary-btn">Next</button>
          </div>
        </section>

        <section id="resultsScreen" class="screen">
          <div class="results-card">
            <p class="eyebrow">Quiz complete</p>
            <h2 id="resultsTitle">Nice work!</h2>
            <div id="scoreSummary" class="score-summary">0 / 0</div>
            <div id="resultsMessage" class="results-message"></div>

            <div id="reviewList" class="review-list"></div>

            <div class="results-actions">
              <button id="retryBtn" class="primary-btn">Play Again</button>
              <button id="resultsHomeBtn" class="secondary-btn">Home</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
